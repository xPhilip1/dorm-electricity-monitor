{% extends "base.html" %}
{% block title %}登录 - 宿舍电费监控{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:12px;">
                <i class="bi bi-lightning-charge-fill"></i>
            </div>
            <h3>宿舍电费监控</h3>
            <p class="login-subtitle">实时监控 · 余额告警 · 保障用电</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label-dark">用户名</label>
                <input type="text" name="username" class="form-control form-control-dark"
                       placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label-dark">密码</label>
                <input type="password" name="password" class="form-control form-control-dark"
                       placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> 登 录
            </button>
        </form>

        {% if first_run %}
        <div style="margin-top:20px;padding:10px 14px;border-radius:8px;font-size:12px;background:rgba(74,142,255,.1);border:1px solid rgba(74,142,255,.25);color:var(--accent-blue);">
            <i class="bi bi-info-circle me-1"></i>首次启动: 初始账号 <strong>admin</strong> / <strong>admin123</strong>，登录后请尽快修改密码
        </div>
        {% endif %}
    </div>
</div>

<script>
    // Flash 消息 3 秒后自动消失
    setTimeout(() => {
        document.querySelectorAll('.flash-msg').forEach(el => el.remove());
    }, 3000);
</script>
{% endblock %}
